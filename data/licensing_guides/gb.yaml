code: GB
country: GB
regulator: Financial Conduct Authority (FCA)
title: How to register a cryptoasset business with the UK FCA
heading: Registering a cryptoasset business in the UK
intro: >-
  Cryptoasset exchanges and custodian wallet providers doing business in the UK
  must register with the Financial Conduct Authority under the Money Laundering
  Regulations 2017 (MLRs). This is an anti-money-laundering registration, not a
  licence. A full FCA authorisation regime for cryptoassets is on its way, so read
  the first section before starting anything.
