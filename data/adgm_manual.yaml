# Abu Dhabi Global Market (ADGM) Financial Services Regulatory Authority
# (FSRA) virtual asset licensees -- MANUALLY maintained, like Gibraltar.
# The actual register/search portal (accessrp.adgm.com) sits behind an
# Akamai bot-management wall that returns a hard 403 even with full
# browser headers -- unlike NY DFS's Cloudflare TLS-fingerprint check,
# this didn't yield to a UA-string fix, so no scripted sync is possible.
#
# This snapshot instead compiles individually-verified Financial Services
# Permission (FSP) grants, each confirmed by reading ADGM's own dedicated
# press release for that grant (or, where ADGM didn't publish one, the
# company's own announcement of its FSP) -- not a search-tool summary.
# This is NOT necessarily exhaustive: ADGM has reportedly authorised 30+
# virtual asset firms in total, and this snapshot only contains the ones
# individually confirmed so far. Same "list fewer, verified entries than
# pad the numbers" discipline as everywhere else on this site.
#
# Distinct from Dubai VARA (data/vara_reg_map or similar) -- ADGM is Abu
# Dhabi's free zone, a different emirate with a different regulator, not
# "the wider UAE" either. See src/pages/[country].astro's isAE branch.
#
# scripts/adgm_manual_apply.py applies this to data/exchanges/, same
# shape as gi_manual_apply.py; must be re-run by hand whenever someone
# manually re-verifies a new grant. No scheduled GitHub Actions workflow.

