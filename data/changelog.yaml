# Public changelog, shown at /changelog/. Append newest entries at the top.
# Written for an external reader (journalists, analysts, exchanges) --
# describe what changed and why it matters, not the internal commit.
- date: "2026-08-03"
  title: "Added Japan (FSA Registered Crypto-asset Exchange Service Providers) — a ninth jurisdiction"
  body: >
    A Japan FSA registration under the Payment Services Act is a genuine
    crypto-specific licence -- in force since 2017, one of the earliest
    dedicated crypto-exchange regimes anywhere, requiring segregated
    offline custody of at least 95% of customer assets, annual audits,
    and JVCEA self-regulatory membership. All 26 currently-registered
    providers are tracked, including 21 newly added as brands in their
    own right (among them GMO Coin, Rakuten Wallet, SBI VC Trade,
    bitbank, and Binance's Japanese entity) alongside five brands we
    already tracked (bitFlyer, Coinbase, Gate.io, HashKey, and OSL).
    The FSA publishes this register as a structured English-language
    spreadsheet directly -- no scraping, no bot protection.
- date: "2026-08-03"
  title: "What does each regulator actually check? A side-by-side comparison"
  body: >
    "Licensed" means something different in every jurisdiction, so the
    Regulators page now explains what each of the 8 regimes we track
    actually assesses before granting status -- typical capital
    requirements, fit-and-proper tests, AML programme expectations, and
    jurisdictional scope -- researched against each regulator's own
    published requirements, with a source link and review date on every
    entry. Sits next to a live count of how many tracked brands currently
    hold each status, so the write-up never goes stale even if the
    underlying figures do.
- date: "2026-08-01"
  title: "A weekly email digest of every regulatory change, register-wide"
  body: >
    A new opt-in weekly email summarising every status change across the
    whole register, for anyone who would rather get one email a week than
    check back here. Double opt-in like the per-exchange alerts below --
    nothing is sent until the address itself confirms -- and every email
    carries a one-click unsubscribe.
- date: "2026-08-01"
  title: "Watch a specific exchange, and get an email if its status changes"
  body: >
    Every exchange page now has a "get an email if this changes" option.
    Double opt-in (nothing is created until you click the confirmation
    link sent to your inbox), no login needed to unsubscribe, and we never
    share the address with the exchange itself or any third party -- full
    detail on the About page.
- date: "2026-08-01"
  title: "Expanded /stats/ with more breakdowns, and per-record structured data"
  body: >
    The stats page now breaks figures down by licence type and by MiCA
    service code, lists all EU/EEA home states rather than just the top
    10, and adds sortable tables. Separately, every verified licence
    record on an exchange page now carries schema.org Certification
    markup, so search engines and other machine readers can parse exactly
    what was verified, by whom, and since when -- not just read it as
    plain text.
- date: "2026-07-31"
  title: "New /regulators/ page: browse by regulatory body, not by country"
  body: >
    The country pages let you browse by where you live; this flips it
    around -- which regulator granted which status, and how many tracked
    brands sit under each one, including a full breakdown of the 26+
    different national authorities that each grant the same MiCA licence
    across the EU/EEA.
- date: "2026-07-31"
  title: "Technology Provider Profiles: a new, clearly separate editorial section"
  body: >
    Some crypto apps aren't licensed themselves -- they sit on top of a
    licensed custodian or execution partner who is. The new /providers/
    section profiles two of these (CryptoUnity, relying on BitGo; Nexo,
    relying on Tangany and DLT Securities GmbH), naming the real partner
    and linking through to their verified status. Deliberately kept
    visually and structurally separate from the register itself, with
    every fact tagged as independently verified or company-disclosed.
- date: "2026-07-31"
  title: "A plain-English summary on every exchange page"
  body: >
    Above the record-by-record detail, each exchange page now opens with
    a short summary sentence -- when we first saw the brand, how many
    jurisdictions and legal entities it holds, and whether its status
    anywhere is a genuine licence or AML-only registration -- before you
    get into the underlying records yourself.
- date: "2026-07-31"
  title: "New top nav bar, and an Exchanges index listing every tracked brand"
  body: >
    Added a persistent top navigation bar (Exchanges, Regulators,
    Providers, Stats) across the whole site, and a new /exchanges/ page:
    every brand we track, in one sortable table, each linking through to
    its full regulatory record. Previously the only ways to reach an
    exchange page were a specific country's table or the search box --
    this is the first single page that links to all of them, and it also
    closes a real internal-linking gap for search engines crawling the
    site.
- date: "2026-07-31"
  title: "Added Gibraltar (GFSC DLT Licence) — our first manually-verified jurisdiction"
  body: >
    A Gibraltar DLT Licence is a genuine crypto-specific licence, the same
    tier as Dubai VARA, Singapore MAS, and Hong Kong SFC. All 11 currently
    licensed DLT providers are tracked, including Bullish (two Gibraltar
    entities) and eToro. This is the first source on the site that is not
    automatically synced: the GFSC's own register sits behind bot
    protection that blocks scripted requests outright, so this list is
    refreshed only when someone manually re-checks the live page in a
    browser -- flagged clearly on the Gibraltar page and everywhere else
    it's mentioned, since it can lag more than every other source here.
- date: "2026-07-30"
  title: "Added Hong Kong (SFC Virtual Asset Trading Platform licence) — all 13 licensees"
  body: >
    Hong Kong's Securities and Futures Commission licence for virtual asset
    trading platforms, mandatory since 2023, is a genuine crypto-specific
    licence -- the same tier as Dubai's VARA licence and Singapore's MAS
    licence, not an AML-only registration. All 13 currently-licensed
    platforms are now tracked, including 10 newly added as brands in their
    own right (Accumulus, BGE, Bixin.com, DFX Labs, EX.IO, HKbitEX, HKVAX,
    PantherTrade, VDX, YAX) alongside three brands we already tracked
    (Bullish, HashKey, and OSL). OSL's Hong Kong entity, OSL Digital
    Securities Limited, is a different legal entity from its EU arm --
    curating this also fixed a naming quirk where that brand had been
    auto-labelled "OSL EU" everywhere on the site, including for its
    non-EU activity.
- date: "2026-07-30"
  title: "New /stats/ page, structured data, and a public X account"
  body: >
    Added a stats page with live, build-time-computed numbers straight from
    the register (genuine-licence vs AML-only split, jurisdiction
    leaderboard, top EU/EEA home states, and the FinCEN fraud-cluster
    finding). Also added schema.org structured data (Organization, Dataset,
    BreadcrumbList) so search engines can parse the register as what it
    actually is, and a public X account, @whichcex, for source updates.
- date: "2026-07-28"
  title: "Site-wide search, covering both exchanges and countries"
  body: >
    Added a header search box across the whole site so you can jump straight
    to any tracked exchange or country page, rather than only browsing via
    the homepage picker.
- date: "2026-07-27"
  title: "Added the US as a fifth tracked jurisdiction (FinCEN MSB Registrant Search)"
  body: >
    29 brands now show a US entry, sourced from FinCEN's MSB Registrant
    Search. Curation surfaced a real fraud pattern in that register: dozens
    of shell-company filings impersonating well-known exchange brand names
    (a fake "Gate.io Binance Crypto BlackRock Ai decentralized" registration,
    a Denver, CO shell claiming to be "Interactive Brokers Inc.", and more),
    concentrated around a handful of Colorado addresses. Those are excluded
    on purpose -- see the About page and the US country page for the full
    explanation. As with Canada, MSB registration is anti-money-laundering
    supervision only, not a licence.
- date: "2026-07-27"
  title: "Sort and tier-filter controls on every country page"
  body: >
    Country tables can now be sorted by newest/oldest registration, by
    number of jurisdictions held, or by services offered, and filtered by
    regulatory tier (e.g. UK Registered vs Authorised) where a page mixes
    more than one.
- date: "2026-07-26"
  title: "Added Singapore (MAS Financial Institutions Directory)"
  body: >
    Singapore MAS Major Payment Institution licences for Digital Payment
    Token services are now tracked -- a genuine crypto-specific licence,
    like Dubai's VARA licence and unlike the UK/Canada/US AML-only
    registrations.
- date: "2026-07-26"
  title: "Added Dubai (VARA Public Register)"
  body: >
    Dubai's Virtual Assets Regulatory Authority licence is genuinely
    crypto-specific, but covers Dubai only -- not Abu Dhabi, not Dubai's own
    DIFC free zone, not the rest of the UAE. There is no single UAE-wide
    crypto regulator, and the /ae/ page says so explicitly.
- date: "2026-07-26"
  title: "Added Canada (FINTRAC MSB Registry)"
  body: >
    Canada's Money Services Business registration is anti-money-laundering
    supervision only, not a licence -- Canada has no dedicated cryptoasset
    licensing regime at all.
- date: "2026-07-24"
  title: "Added the UK (FCA Register)"
  body: >
    Most UK crypto entities hold only an anti-money-laundering MLR
    registration, not a licence -- the UK's own cryptoasset licensing regime
    doesn't open for applications until 30 Sep 2026. A smaller number of
    brands also have a UK entity that's separately, fully FCA-authorised,
    usually for a different (non-crypto) activity. Both tiers are shown,
    clearly labelled.
- date: "2026-07-24"
  title: "Launch: ESMA-fed MiCA register, 13 seeded brands, 30 EU/EEA country pages"
  body: >
    The initial release, drawing directly from ESMA's interim MiCA register
    (CASPS.csv) with automated scheduled re-syncs and a reviewed
    pull-request workflow for every data update.
