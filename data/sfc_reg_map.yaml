# Brand id -> list of Hong Kong SFC Virtual Asset Trading Platform (VATP)
# CE References. Verify each reference against the live "List of licensed
# virtual asset trading platforms" table before adding -- no guesses.
# https://www.sfc.hk/en/Welcome-to-the-Fintech-Contact-Point/Virtual-assets/Virtual-asset-trading-platforms-operators/Lists-of-virtual-asset-trading-platforms
#
# A VATP licence is a genuine crypto-specific licence (mandatory since 2023
# under the Securities and Futures Ordinance) -- same tier as Dubai VARA and
# Singapore MAS, not an AML-only registration like UK/Canada/US.
#
# sfc_sync.py re-fetches the live page at sync time and looks up these
# references fresh -- this file only pins identity, same curation pattern
# as brand_map.yaml (LEI), fca_frn_map.yaml (FRN), and fincen_reg_map.yaml
# (BSA ID).

bullish:
  - ce_reference: "BUQ956"  # Bullish HK Markets Limited (Bullish)
hashkey:
  - ce_reference: "BPL992"  # Hash Blockchain Limited (HashKey Exchange)
osl-eu:
  - ce_reference: "BPJ213"  # OSL Digital Securities Limited (OSL Exchange)
