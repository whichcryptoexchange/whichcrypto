# Brand id -> list of FinCEN MSB Registrant Search BSA IDs.
#
# FinCEN has no bulk registry export (unlike FINTRAC's CSV) -- registrants
# are only searchable one at a time via the MSB Registrant Search
# (https://msb.fincen.gov/). fincen_sync.py looks each BSA ID up live and
# pins identity the same way brand_map.yaml pins LEIs and fca_frn_map.yaml
# pins FRNs.
#
# IMPORTANT -- this register has a real, material fraud problem: FinCEN's
# own site prominently warns that fraudsters register shell companies using
# well-known brand names to appear "FinCEN approved". During curation we
# found dozens of exactly that pattern -- near-identical shell filings out of
# Denver/Colorado Springs/Boulder CO and Kalispell MT, registered for every
# possible MSB activity code, using names like "Crypto.com Exchange Ltd",
# "Upbit", "Swissquote Ltd", "Interactive Brokers Inc.", and a literal
# "Gate.io Binance Crypto BlackRock Ai decentralized". None of those are
# included here. Only entries below were confirmed against a real, known
# corporate address/structure for that brand -- do not add more without the
# same scrutiny.
#
# MSB registration is anti-money-laundering supervision, not a licence --
# same framing as Canada FINTRAC. There is also no single national US
# register for state-level money transmitter licensing (50 separate
# regimes) -- out of scope here, same reasoning as FINTRAC's provincial
# securities-dealer caveat.

