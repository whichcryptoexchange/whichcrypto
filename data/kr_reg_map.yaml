# Pinned Korea FIU (KoFIU) registered legal entity names -> brand_id.
# scripts/kr_sync.py re-fetches each pinned entity's presence/acceptance
# date from the live "가상자산사업자 신고에 관한 정보공개 현황" (VASP registration
# disclosure) spreadsheet and writes it into that brand's countries.KR entry
# -- it does not auto-discover new brands, same pattern as my_reg_map.yaml.
#
# Registration under the Act on Reporting and Using Specified Financial
# Transaction Information is AML/CFT reporting only, not a business licence
# -- same tier as UK/Canada/US, not the genuine-licence tier of MiCA/VARA/
# MAS/SFC/GFSC/FSA/SC. See data/regulator_details.yaml for the source.
#
# caveat: four entities here (Wavebridge Prime, Bauman, Robit, ABC Cloud
# Wallet) were also named in a 25 Jun 2026 KoFIU press release on
# unregistered illegal virtual-asset handlers referred to police -- despite
# also appearing on this same registered list. We could not resolve that
# apparent contradiction from primary sources (likely: registered for one
# narrow declared activity while investigated for an unregistered one), so
# it is surfaced directly on their pages rather than silently included or
# excluded.
