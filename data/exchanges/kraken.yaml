audits:
- tier: proof_of_reserves
  status: active
  auditor: The Network Firm (registered CPA firm)
  frequency: Recurring, roughly quarterly
  last_date: '2025-09-30'
  summary: Kraken engages The Network Firm, a registered CPA firm specialising in cryptocurrency attestation,
    to independently confirm Kraken controls the wallets holding client balances. Reports use a Merkle
    tree structure with user-verifiable "Merkle Leaf IDs", letting individual clients personally verify
    their own balance was included. This is a genuine, recurring, independently-attested proof-of-reserves
    programme -- not a full financial audit (it doesn't cover liabilities or internal controls the way
    Coinbase's SEC audit does), but among the stronger examples of this tier.
  sources:
  - name: Kraken — Proof of Reserves, September 2025
    url: https://blog.kraken.com/news/september-2025-proof-of-reserves
  - name: Kraken — Proof of Reserves, June 30 2025
    url: https://blog.kraken.com/news/proof-of-reserves-june-30-2025
  retrieved: '2026-08-14'
