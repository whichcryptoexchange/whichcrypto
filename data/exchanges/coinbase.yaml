  frequency: Annual, recurring — required as an SEC-reporting public company
  last_date: '2024-02-15'
  summary: 'Coinbase Global, Inc. is a publicly listed, SEC-reporting company, so its full consolidated
    financial statements -- including internal-control effectiveness -- are independently audited annually
    by Deloitte & Touche LLP and filed with the SEC as part of its 10-K. This is the strongest tier of
    assurance on this list: a comprehensive financial audit, not a narrower point-in-time reserves check.
    Deloitte has signed Coinbase''s auditor''s report in each 10-K filed since Coinbase went public, most
    recently for fiscal year 2025.'
