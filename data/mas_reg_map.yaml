# Brand id -> list of Singapore MAS Financial Institutions Directory
# references (Major Payment Institution licence, Digital Payment Token
# Service activity). Verify each reference against the live directory
# before adding — no guesses.
# https://eservices.mas.gov.sg/fid/institution?sector=Payments&category=Major+Payment+Institution&activity=Digital+Payment+Token+Service
#
# mas_sync.py re-fetches the live directory at sync time and looks up
# these references fresh — this file only pins identity, same curation
# pattern as brand_map.yaml (LEI), fca_frn_map.yaml (FRN),
# fintrac_reg_map.yaml (MSB registration number), and vara_reg_map.yaml
# (VARA licence reference).
#
# anchorage-digital, hashkey, paxos, upbit, and independent-reserve were
# bootstrapped via scripts/bootstrap_brand.py — they have no EU entity at
# all, so this is their only jurisdiction entry.

