# NY DFS "Licensed Entities" table (virtual currency licensees, granted
# both under Part 200 ("BitLicense") and as limited purpose trust company
# charters). Maps each legal entity name on that table to the brand_id it
# belongs to in data/exchanges/*.yaml -- most brands with more than one NY
# entity (e.g. Coinbase, Circle, MoonPay) hold both a BitLicense/money
# transmitter licence AND a separate trust charter through different legal
# entities. caveat, where present, is copied verbatim onto that entry's
# countries.US record (see src/pages/exchange/[id].astro's entry.caveat
# rendering) -- it is never used to imply anything the DFS grant itself
# doesn't say.
