# British Virgin Islands (BVI) Financial Services Commission (FSC) Virtual
# Assets Service Providers register -- MANUALLY maintained, like Gibraltar
# and ADGM. The FSC's own register page (bvifsc.vg/regulated-entities-vasp)
# sits behind bot protection that returns a hard 403 to scripted requests
# even with a realistic browser User-Agent and referer -- same wall as
# Gibraltar's GFSC. This snapshot was read by a human in a real browser
# (paginated, 57 raw rows across 4 pages, deduplicated by legal entity)
# and pasted in; scripts/bvi_manual_apply.py applies it to
# data/exchanges/, same shape as gi_manual_apply.py -- must be re-run by
# hand whenever someone re-checks the live pages and updates this file.
# No scheduled GitHub Actions workflow for this one.
#
# A BVI VASP registration under the Virtual Assets Service Providers
# Act, 2022 is a genuine crypto-specific regime (like VARA/MAS/SFC/
# Gibraltar/ADGM), not an AML-only registration bolted onto an existing
# generic framework.
#
# Deliberately excludes every "Authorised Representatives - VASP" entry
# on the register -- those are local registered-agent firms required by
# law for any VASP operating from the BVI, not the VASP/exchange itself.
# Also excludes a handful of entries with neither a verifiable website
# nor a clear trading name (Lead Accelerating Limited, Portofino
# Technologies Global Limited, TDX Strategies Ltd) -- too thin to
# confidently represent as a real consumer-facing brand; omitted rather
# than guessed at, same discipline as everywhere else on this site.

