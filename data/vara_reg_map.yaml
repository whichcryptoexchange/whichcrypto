# Brand id -> list of VARA (Dubai Virtual Assets Regulatory Authority) VASP
# Licence references. Verify each reference against the live public register
# before adding — no guesses.
# https://www.vara.ae/en/licenses-and-register/public-register/
#
# IMPORTANT: VARA licenses cover DUBAI ONLY — not Abu Dhabi (ADGM/FSRA), not
# Dubai's own DIFC free zone (DFSA), not the rest of the UAE (federal SCA).
# There is no single UAE-wide crypto regulator. vara_sync.py and the /ae/
# page must keep this scope caveat loud and explicit, every time — see
# vara_sync.py's docstring for the framing this drives.
#
# vara_sync.py re-fetches the live public register at sync time and looks up
# these references fresh — this file only pins identity, same curation
# pattern as brand_map.yaml (LEI), fca_frn_map.yaml (FRN), and
# fintrac_reg_map.yaml (MSB registration number).
#
# Expanded 2026-08-07 from 3 to 52 entries (all live references at the
# time) after a full reconciliation against the live register -- the
# reg_map had only ever been curated for the first 3 brands added to this
# site, not kept in step as VARA's own licensee list grew to 52.


