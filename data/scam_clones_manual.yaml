# Hand-curated clone/scam-firm warnings, sourced only from the tracked
# brand's own official regulator page -- applied to data/exchanges/ by
# scripts/scam_clones_manual_apply.py.
#
# A "clone" is a scammer using a genuine authorised firm's name, FRN, and
# sometimes staff names to pose as that firm -- the FCA Register surfaces
# these under a "Clones of this firm" notice on the real firm's own page
# when it knows about one. There is no API/feed for this (the public FCA
# V0.1 REST API used by fca_sync.py does not expose it); each entry here
# was read directly off the regulator's live register page by hand. This
# is deliberately NOT exhaustive -- only regulators/brands actually
# checked so far have entries below. Absence of an entry is not a claim
# that a brand has no clones; it means none has been found/checked yet.
#
# retrieved: when the source_url pages below were last checked.
retrieved: '2026-08-15'
clones:
