# What each regulator actually checks before granting status -- manually
# researched against primary/authoritative sources (not auto-synced, since
# this describes the regime itself rather than which brands hold it; see
# each entry's source_url and verified date). Capital figures in particular
# change over time -- treat these as "as of last review", and follow
# source_url for the current figure.
- code: MICA
  name: EU/EEA MiCA CASP Authorisation
  tier: licensed
  tier_label: Genuine licence
  scope: Single-state authorisation, passports across the whole EU/EEA
  capital: "EUR 50,000-150,000 minimum paid-up capital (varies by service), or one quarter of the prior year's fixed overheads, whichever is higher"
  checks:
    - Fit-and-proper assessment of the management body and qualifying shareholders
    - A written AML/CTF programme
    - Safeguarding arrangements for client funds and crypto-assets
    - IT security, business continuity, and operational readiness
    - Conflicts-of-interest policy and market-integrity rules
  source_url: https://www.esma.europa.eu/esmas-activities/digital-finance-and-innovation/markets-crypto-assets-regulation-mica
  verified: '2026-08-03'
- code: GB
  name: UK Financial Conduct Authority (FCA)
  tier: gb-registered
  tier_label: AML-only registration (mixed with some full authorisation)
  scope: UK only, no passporting
  capital: "No minimum capital specified -- the FCA asks for realistic financial information matched to the business model, not a prescribed figure"
  checks:
    - Fit-and-proper assessment of owners, senior managers, and the MLRO
    - A written AML/CTF/CPF risk assessment (business-wide and per-customer)
    - Configured transaction-monitoring tooling, on-chain and off-chain
    - Evidence the AML control framework is already operational, not just planned
  note: A smaller number of UK entities are separately, fully FCA-authorised (SM&CR applies) -- a broader regime, but usually for a different, non-crypto activity.
  source_url: https://www.fca.org.uk/firms/cryptoassets/application-registration
  verified: '2026-08-03'
- code: CA
  name: Canada FINTRAC
  tier: gb-registered
  tier_label: AML-only registration
  scope: Federal registration only -- does not cover CIRO investment-dealer or provincial securities-dealer registration
  capital: "No minimum capital requirement"
  checks:
    - A compliance officer and written policies and procedures
    - A documented risk assessment
    - An ongoing staff training programme
    - An independent effectiveness review at least every two years
    - Large virtual-currency-transaction and suspicious-transaction reporting
  source_url: https://fintrac-canafe.canada.ca/msb-esm/msb-eng
  verified: '2026-08-03'
- code: AE
  name: Dubai Virtual Assets Regulatory Authority (VARA)
  tier: licensed
  tier_label: Genuine licence
  scope: Dubai only -- VARA has no authority over Abu Dhabi, Dubai's own DIFC free zone, or the rest of the UAE
  capital: "AED 100,000 (advisory services) up to the higher of AED 1,500,000 or 25% of fixed annual overheads (exchange operation, or AED 800,000 / 15% if already custody-licensed), varying across VARA's seven licensed activity categories -- per the Company Rulebook in force since 19 Jun 2025"
  checks:
    - Two Responsible Individuals, UAE-resident and assessed fit-and-proper
    - AML/CFT policies and risk controls
    - Cybersecurity and technology architecture documentation
    - Client-asset segregation arrangements
    - Market-surveillance obligations for exchange operators specifically
  source_url: https://www.vara.ae/en/licenses-and-register/licence-applications/
  verified: '2026-08-06'
- code: AE-ADGM
  name: Abu Dhabi Global Market Financial Services Regulatory Authority (ADGM FSRA)
  tier: licensed
  tier_label: Genuine licence (manually verified -- see About)
  scope: Abu Dhabi Global Market only -- a different emirate and a different regulator from Dubai VARA above; neither covers the wider UAE
  capital: "USD 250,000 base capital requirement (the higher of that or an expenditure-based minimum tied to six months' audited expenditure), rising to USD 750,000 for custody providers handling client assets"
  checks:
    - A Financial Services Permission (FSP) covering the specific regulated activity -- operating a Multilateral Trading Facility, dealing as principal/agent, custody, or managing/advising on virtual assets
    - Every virtual asset used, traded, or custodied must be an FSRA-designated "Accepted Virtual Asset"
    - Fit-and-proper assessment of controllers and senior management
    - Client-asset segregation and custody arrangements
  note: Like Gibraltar, this is not automatically synced. ADGM's own register/search portal (accessrp.adgm.com) sits behind an Akamai bot wall that returns a hard 403 even with full browser headers -- this list instead compiles individually-verified Financial Services Permission grants, each checked against its own dedicated press release, and is not necessarily exhaustive (ADGM has reportedly authorised 30+ virtual asset firms in total).
  source_url: https://www.adgm.com/public-registers
  verified: '2026-08-07'
- code: SG
  name: Singapore Monetary Authority (MAS)
  tier: licensed
  tier_label: Genuine licence
  scope: Singapore only
  capital: "SGD 500,000 base capital specifically for Digital Payment Token service (the category crypto exchanges hold, higher than the generic SGD 250,000 Major Payment Institution figure), plus a security deposit of SGD 100,000-200,000 depending on transaction volume"
  checks:
    - AML/CFT controls aligned to MAS Notice PSN02, including travel-rule compliance for token transfers
    - A Singapore-incorporated company with a resident CEO and at least one resident executive director
    - Technology risk management standards
  note: Processing time varies by source -- commonly cited as roughly 6-12 months from a complete application, longer for complex cases.
  source_url: https://www.mas.gov.sg/regulation/payment-services
  verified: '2026-08-06'
- code: US
  name: US FinCEN
  tier: gb-registered
  tier_label: AML-only registration
  scope: Federal registration only -- does not cover the up to 50 separate state-level money transmitter licensing regimes. New York is the one state-level regime we do separately track -- see the NY DFS entry below.
  capital: "No minimum capital requirement at the federal level"
  checks:
    - A written AML programme under 31 CFR 1022.210-- internal controls, a compliance officer, staff training, and an independent review
    - Suspicious Activity Report filing for transactions of $2,000 or more with a plausible illicit link
    - Re-registration every two years via FinCEN Form 107
  note: This register also has a known fraud problem -- see our About page for the shell-company pattern we found and excluded during curation.
  source_url: https://www.fincen.gov/money-services-business-msb-registration
  verified: '2026-08-03'
- code: US-NY
  name: New York State DFS (BitLicense)
  tier: licensed
  tier_label: Genuine licence
  scope: State-level, New York only -- one of roughly 50 separate US state money transmitter regimes, and the only one with a dedicated crypto-specific licence and a public, checkable list. A brand can hold this without holding, or needing, the federal FinCEN registration above, and vice versa -- they are two independent regimes we track separately under the same "US" country page.
  capital: "Risk-based and discretionary under 23 NYCRR 200.8 -- the Superintendent sets a capital amount case by case based on the licensee's assets, liabilities, and business model, not a fixed minimum. A separate surety bond, typically at least $500,000, is also required under 23 NYCRR 200.9."
  checks:
    - Either a Virtual Currency License ("BitLicense") under 23 NYCRR Part 200, a Limited Purpose Trust Charter under the NY Banking Law, or both
    - Fingerprint-based background checks and a character-and-fitness review of directors, senior officers, and key personnel
    - A written AML/BSA-equivalent compliance programme, cybersecurity programme, and business continuity/disaster recovery plan
    - Prior DFS approval before a material change in business, including new products or services
  note: NYDFS licenses two distinct things under one list -- a BitLicense (money-transmission-style, for exchanges/custodians dealing directly with customers) and a Limited Purpose Trust Charter (a state trust company, often used for custody or stablecoin issuance). We record which one each brand holds; both count as a genuine licence here.
  source_url: https://www.dfs.ny.gov/virtual_currency_businesses
  verified: '2026-08-06'
- code: HK
  name: Hong Kong Securities and Futures Commission (SFC)
  tier: licensed
  tier_label: Genuine licence
  scope: Hong Kong only
  capital: "Reported to require HK$5,000,000 paid-up share capital, liquid capital of the higher of HK$3,000,000 or the regulatory 'basic amount', and 12 months' operating expenses held in liquid Hong Kong assets (not virtual assets)"
  checks:
    - Fit-and-proper Responsible Officers and Managers-in-Charge, with set qualification/experience thresholds
    - Dual licensing -- Type 1 (dealing in securities) and Type 7 (automated trading services) for platforms trading security tokens, or a separate AMLO Part 5B licence for non-security tokens only
    - Custody and client-asset safeguarding rules
    - Token due-diligence before listing
  source_url: https://www.sfc.hk/en/Regulatory-functions/Intermediaries/Licensing/Do-you-need-a-licence-or-registration
  verified: '2026-08-03'
- code: GI
  name: Gibraltar Financial Services Commission (GFSC)
  tier: licensed
  tier_label: Genuine licence (manually verified -- see About)
  scope: Gibraltar only
  capital: "No fixed minimum published -- principles-based 'adequate financial and non-financial resources' requirement instead of a set figure"
  checks:
    - A 10-principle framework -- honesty and integrity, fair treatment and clear communication with customers, adequate financial resources, sound risk management, safe custody and segregation of client assets, robust systems and security, effective corporate governance, resolution/recovery planning, AML/CFT, and market integrity
    - Gibraltar incorporation or a registered branch with a genuine local presence
    - A qualified, appointed MLRO
  source_url: https://www.gibraltarlaw.com/insights/dlt-regulation-gibraltar/
  verified: '2026-08-03'
- code: JP
  name: Japan Financial Services Agency (FSA)
  tier: licensed
  tier_label: Genuine licence
  scope: Japan only
  capital: "JPY 10,000,000 minimum (roughly USD 65,000), though most applicants report spending USD 1-5 million in total to actually get through the process"
  checks:
    - Segregated custody -- at least 95% of customer crypto-assets held in an offline (cold) wallet
    - Fit-and-proper screening of the CEO, CTO, compliance officer, AML officer, and other key persons, including FSA interviews
    - A written AML/CFT programme and market-integrity controls
    - Audited financial statements and asset segregation
    - JVCEA self-regulatory body membership
  note: In force since 2017 (post-Mt.Gox) -- one of the earliest dedicated crypto-exchange licensing regimes anywhere, and the source is an official English-language spreadsheet the FSA publishes directly, not a scraped page.
  source_url: https://www.fsa.go.jp/en/regulated/licensed/index.html
  verified: '2026-08-03'
- code: MY
  name: Malaysia Securities Commission (SC)
  tier: licensed
  tier_label: Genuine licence
  scope: Malaysia only
  capital: "RM15,000,000 minimum paid-up capital under the Guidelines on Recognized Markets revised effective 20 May 2026 (up from RM5,000,000), plus shareholders' funds of the higher of RM5,000,000 (RM7,000,000 for a Direct Trade model) or 25% of annual operating expenses -- existing operators have until 20 May 2028 to comply"
  checks:
    - Fit-and-proper assessment of directors, the chief executive, controllers, and senior management
    - Robust internal controls and risk management frameworks
    - AML/CFT compliance
    - Locally incorporated company in Malaysia
  note: The SC's own page also separately lists historical operators no longer permitted to continue -- only the currently registered list (5 operators as of review) is used here.
  source_url: https://www.sc.com.my/regulation/guidelines/recognizedmarkets/list-of-registered-digital-asset-exchanges
  verified: '2026-08-06'
- code: KR
  name: Korea Financial Intelligence Unit (FIU)
  tier: gb-registered
  tier_label: AML-only registration
  scope: South Korea only -- no dedicated cryptoasset business licensing regime exists yet
  capital: "No minimum capital requirement -- this is an AML/CFT reporting regime, not a business licence"
  checks:
    - Company identity and prescribed business details reported to the FIU Commissioner
    - Real-name-verified bank account agreement with a domestic bank (required to handle KRW deposits/withdrawals)
    - Information security management system certification
    - Ongoing AML/CFT reporting, customer due diligence, and recordkeeping obligations
  note: The FIU also publishes periodic consumer warnings naming which handlers are NOT on this list (i.e. operating illegally) -- registration on this list does not itself constitute business-conduct approval, only AML/CFT reporting compliance.
  source_url: https://www.kofiu.go.kr/kor/notification/notice.do
  verified: '2026-08-05'
- code: NZ
  name: New Zealand Department of Internal Affairs (DIA)
  tier: gb-registered
  tier_label: AML-only registration (manually verified)
  scope: New Zealand only -- no dedicated cryptoasset business licensing regime exists; virtual asset service providers register on the Financial Service Providers Register (FSPR) under general AML/CFT law
  capital: "No minimum capital requirement -- this is an AML/CFT reporting regime, not a business licence"
  checks:
    - Registration on the Financial Service Providers Register (FSPR), administered by the Companies Office
    - A written AML/CFT programme, risk assessment, and compliance officer under the AML/CFT Act 2009
    - Ongoing customer due diligence, suspicious activity reporting, and recordkeeping obligations
    - Since 1 July 2026, sole AML/CFT supervision by the Department of Internal Affairs (DIA) under the AML/CFT (Supervisor, Levy, and Other Matters) Amendment Act 2026
  note: The FSPR's public search tool has no fetchable API or bulk export available to us, so this list is manually verified against the live register rather than synced on a schedule -- same discipline as Gibraltar and ADGM, but for an AML-only tier rather than a genuine licence.
  source_url: https://fsp-app.companiesoffice.govt.nz/orp-master/service/create.html?targetAppCode=orp-master&service=registerItemSearch
  verified: '2026-08-09'
- code: VG
  name: British Virgin Islands Financial Services Commission (FSC)
  tier: licensed
  tier_label: Genuine licence (manually verified)
  scope: British Virgin Islands only -- registration under a dedicated crypto-specific regime, not AML-only
  capital: "Varies by registration category (general VASP, custody, exchange) -- see the FSC's VASP application guidance for specifics"
  checks:
    - Registration with the FSC under one or more categories (general VASP, custody, exchange) before commencing any VASP activity
    - A registered agent/authorised representative physically present in the BVI
    - Ongoing recordkeeping of transactions and financial statements, plus AML/CFT steps taken
    - Annual submission of an auditor's report to the FSC
    - FSC approval required for changes such as a change of company name or disposal of a significant interest
  note: The FSC's register page (bvifsc.vg/regulated-entities-vasp) returns a hard 403 to scripted requests even with a realistic browser User-Agent and referer -- confirmed directly. This list is manually verified against the live paginated register rather than synced on a schedule, same discipline as Gibraltar and ADGM. Excludes "Authorised Representatives - VASP" entries, which are local registered-agent firms required by law for any VASP operating from the BVI, not VASPs themselves.
  source_url: https://www.bvifsc.vg/regulated-entities-vasp
  verified: '2026-08-10'
- code: AU
  name: Australian Transaction Reports and Analysis Centre (AUSTRAC)
  tier: gb-registered
  tier_label: AML-only registration
  scope: Federal registration only -- covers AUSTRAC's AML/CTF supervision. Does not cover ASIC's Australian Financial Services Licence (AFSL), which was extended to crypto exchanges, custodians, and brokers by the Corporations Amendment (Digital Assets Framework) Act 2026 (Royal Assent 8 Apr 2026) under two new categories, Digital Asset Platform and Tokenised Custody Platform -- that regime is still phasing in and not yet tracked here.
  capital: "No minimum capital requirement -- this is an AML/CFT reporting regime, not a business licence"
  checks:
    - Registration with AUSTRAC as a virtual asset service provider before offering any designated virtual asset service (exchange, safekeeping, transfer, or facilitating the offer/sale of a virtual asset)
    - A written AML/CTF programme, ongoing customer due diligence, and suspicious-matter reporting
    - AUSTRAC can suspend, cancel, or refuse to renew a registration -- or refuse an application outright -- if it identifies an unacceptable money-laundering, terrorism-financing, or serious-crime risk
  note: AUSTRAC published a genuinely public, searchable register (VASPR) in mid-2026, with a clean unauthenticated JSON search API behind it -- no bot wall, unlike Gibraltar/ADGM/NZ/BVI. Matched by ABN, not name, since AUSTRAC's own legal names routinely have nothing to do with the consumer brand.
  source_url: https://online.apps.austrac.gov.au/vaspr
  verified: '2026-08-18'
