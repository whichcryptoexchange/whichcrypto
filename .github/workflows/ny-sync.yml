name: NY DFS sync

on:
  schedule:
    - cron: '0 14 * * 5'   # Fri 14:00 UTC — offset from the other jurisdictions' runs
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyyaml
      - name: Refresh NY DFS licensed virtual currency entity data
        run: python3 scripts/ny_sync.py
      - name: Open PR if the register changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "data: NY DFS sync"
          title: "NY DFS update — review changes"
          body-path: .pr-body.md
          branch: ny-sync
          delete-branch: true
