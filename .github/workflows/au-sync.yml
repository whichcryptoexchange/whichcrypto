name: AUSTRAC VASPR sync

on:
  schedule:
    - cron: '0 15 * * 5'   # Fri 15:00 UTC — offset from the other jurisdictions' runs
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyyaml
      - name: Refresh AUSTRAC VASPR data
        run: python3 scripts/au_sync.py
      - name: Open PR if the register changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "data: AUSTRAC VASPR sync"
          title: "AUSTRAC VASPR update — review changes"
          body-path: .pr-body.md
          branch: au-sync
          delete-branch: true
