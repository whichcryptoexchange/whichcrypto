name: VARA register sync

on:
  schedule:
    - cron: '30 7 * * 4'   # Thu 07:30 UTC — offset from the 07:00 ESMA run
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pyyaml
      - name: Refresh Dubai VARA register data
        run: python3 scripts/vara_sync.py
      - name: Open PR if the register changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "data: VARA register sync"
          title: "VARA (Dubai) register update — review changes"
          body-path: .pr-body.md
          branch: vara-sync
          delete-branch: true
